<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Termin buchen</title>
<style>
  :root{
    --bg:#FAFAF7;
    --panel:#FFFFFF;
    --border:#E7E6EF;
    --border-strong:#D6D4E4;
    --ink:#12162B;
    --ink-muted:#6B6B78;
    --ink-faint:#B4B3C2;
    --accent:#5B67F1;
    --accent-soft:#EDEFFD;
    --accent-hover:#E1E4FC;
    --accent-contrast:#FFFFFF;
    --navy:#12162B;
    --danger:#B3261E;
    --radius:14px;
    --font-display:'Space Grotesk','Inter',sans-serif;
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:900px;
    margin:0 auto;
    padding:24px 20px 60px;
  }
  .card{
    position:relative;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:var(--panel);
    box-shadow:0 1px 3px rgba(18,22,43,0.06), 0 12px 32px rgba(18,22,43,0.05);
    overflow:hidden;
  }

  /* header */
  .card-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    padding:22px 24px 0;
  }
  .card-title{
    font-family:var(--font-display);
    font-size:20px;
    font-weight:500;
    margin:0;
  }
  .card-subtitle{
    font-size:13px;
    color:var(--ink-muted);
    margin:4px 0 0;
  }
  .close-btn{
    width:30px;height:30px;
    border:none;
    background:transparent;
    border-radius:8px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-muted);
  }
  .close-btn:hover{background:var(--bg);color:var(--ink);}

  /* main grid */
  .main-grid{
    display:grid;
    grid-template-columns:1fr 300px;
    gap:0;
    padding:18px 24px 8px;
  }
  @media (max-width:640px){
    .main-grid{grid-template-columns:1fr;}
  }

  .calendar-col{padding-right:24px;}
  @media (max-width:640px){
    .calendar-col{padding-right:0;border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:16px;}
  }
  .cal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .cal-month{
    font-family:var(--font-display);
    font-size:16px;
    font-weight:500;
  }
  .cal-nav{display:flex;gap:4px;}
  .cal-nav button{
    width:30px;height:30px;
    border:1px solid var(--border);
    background:var(--panel);
    border-radius:8px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink);
    font-size:15px;
  }
  .cal-nav button:hover{border-color:var(--border-strong);}
  .cal-nav button:disabled{opacity:0.35;cursor:default;}
  .weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    text-align:center;
    font-size:12px;
    font-weight:500;
    color:var(--ink-muted);
    margin-bottom:6px;
  }
  .weekdays div{padding:4px 0;}
  .days{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:2px;
  }
  .day{
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    font-size:14px;
    cursor:default;
    color:var(--ink-faint);
    margin:2px;
  }
  .day.in-month{color:var(--ink-muted);}
  .day.has-slots{
    color:var(--accent);
    font-weight:600;
    cursor:pointer;
    background:var(--accent-soft);
  }
  .day.has-slots:hover{background:var(--accent-hover);}
  .day.selected{
    background:var(--navy);
    color:#FFFFFF;
  }
  .day.selected:hover{background:var(--navy);}

  .cal-loading{
    font-size:13px;
    color:var(--ink-muted);
    padding:16px 0;
  }
  .tz-row{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--ink-muted);
    margin-top:14px;
  }
  .tz-row svg{width:14px;height:14px;stroke:var(--ink-muted);}

  /* time slot column */
  .slots-col{
    display:flex;
    flex-direction:column;
    gap:10px;
    max-height:420px;
    overflow-y:auto;
    padding:2px 2px 2px 20px;
    border-left:1px solid var(--border);
  }
  @media (max-width:640px){
    .slots-col{border-left:none;padding-left:2px;}
  }
  .slot-card{
    border:1px solid var(--border);
    background:var(--panel);
    border-radius:10px;
    padding:12px 16px;
    text-align:center;
    cursor:pointer;
    transition:border-color .12s, background .12s;
  }
  .slot-card:hover{border-color:var(--accent);}
  .slot-card .slot-main{
    font-size:15px;
    font-weight:600;
    color:var(--accent);
  }
  .slot-card .slot-sub{
    font-size:12px;
    color:var(--ink-muted);
    margin-top:2px;
  }
  .slot-card.selected{
    background:var(--accent);
    border-color:var(--accent);
  }
  .slot-card.selected .slot-main{color:#FFFFFF;}
  .slot-card.selected .slot-sub{color:rgba(255,255,255,0.8);}
  .no-slots-msg{font-size:13px;color:var(--ink-faint);padding:8px 2px;}

  /* footer bar */
  .footer-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:16px 24px;
    border-top:1px solid var(--border);
    margin-top:14px;
  }
  .footer-summary{
    font-size:14px;
    font-weight:600;
    color:var(--ink);
  }
  .footer-summary.empty{color:var(--ink-faint);font-weight:400;}
  .footer-actions{display:flex;gap:10px;}
  .btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    justify-content:center;
    padding:10px 18px;
    border-radius:9px;
    border:1px solid transparent;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    font-family:var(--font-body);
  }
  .btn-primary{
    background:var(--navy);
    color:#FFFFFF;
  }
  .btn-primary:disabled{
    background:var(--ink-faint);
    cursor:not-allowed;
  }
  .btn-secondary{
    background:transparent;
    color:var(--ink);
    border-color:var(--border-strong);
  }
  .btn-secondary:hover{border-color:var(--ink-muted);}

  /* status overlay (loading / success / error) */
  .overlay{
    position:absolute;inset:0;
    background:rgba(250,250,247,0.96);
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    z-index:5;
  }
  .status-card{max-width:340px;text-align:center;}
  .status-card h2{
    font-family:var(--font-display);
    font-size:18px;
    font-weight:500;
    margin:14px 0 6px;
  }
  .status-card p{
    font-size:14px;
    color:var(--ink-muted);
    line-height:1.5;
    margin:0 0 18px;
  }
  .icon-circle{
    width:44px;height:44px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto;
  }
  .icon-circle.success{background:var(--accent-soft);color:var(--accent);}
  .icon-circle.error{background:#FBEAE9;color:var(--danger);}
  .spinner{
    width:22px;height:22px;
    border:2.5px solid var(--border);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin .7s linear infinite;
    margin:0 auto;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="app">
  <div class="card" id="card">

    <div class="card-header">
      <div>
        <h1 class="card-title">Datum &amp; Uhrzeit wählen</h1>
        <p class="card-subtitle" id="cardSubtitle"></p>
      </div>
      <button class="close-btn" id="closeBtn" aria-label="Schließen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="main-grid">
      <div class="calendar-col">
        <div class="cal-header">
          <div class="cal-month" id="calMonth"></div>
          <div class="cal-nav">
            <button id="prevMonth" aria-label="Vorheriger Monat">‹</button>
            <button id="nextMonth" aria-label="Nächster Monat">›</button>
          </div>
        </div>
        <div class="weekdays">
          <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div>
        </div>
        <div class="days" id="daysGrid"></div>
        <div class="cal-loading" id="calLoading">Verfügbarkeit wird geladen…</div>
        <div class="tz-row">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.5 6 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-6-3.5-9s1-6.5 3.5-9z"/></svg>
          <span>Mitteleuropäische Zeit (MEZ)</span>
        </div>
      </div>

      <div class="slots-col" id="slotsCol">
        <div id="slotsList"></div>
      </div>
    </div>

    <div class="footer-bar">
      <div class="footer-summary empty" id="footerSummary">Noch keine Auswahl</div>
      <div class="footer-actions">
        <button class="btn btn-secondary" id="cancelSelectionBtn">Abbrechen</button>
        <button class="btn btn-primary" id="confirmBtn" disabled>
          Termin bestätigen
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>

  </div>
</div>

<script>
/* ---------------------------------------------------------------
   CONFIG — point these at your Make.com "immediate response" webhooks
--------------------------------------------------------------- */
const CONFIG = {
  GET_SLOTS_URL: "https://hook.eu1.make.celonis.com/s7kd580bgkyxtq7hgk3aj9hjygxjicoi",
  BOOK_SLOT_URL: "https://hook.eu1.make.celonis.com/ro24vhas3durfjywni3vgaxhv96grbk5",
  SERVICE_NAME: "Beratungstermin",
  DURATION_LABEL: "30 Min.",
  DEFAULT_RANGE: 14   // fallback search radius (km) if not passed in the URL
};

/* ---------------------------------------------------------------
   Read customer data from the URL. Noloco should build the iframe
   src with these query params filled in from the record, matching
   the suggestions API body exactly, e.g.:

   booking-calendar.html?customerId=rec123&name=Jane%20Doe
     &orderNumber=DEHP6000849617&gcId=a72da201-516f-4580-ae6d-94ca3137c63a
     &signUpId=63d06452-b76d-4d4c-98e2-d9a828d61e0
     &latitude=52.496429&longitude=13.422596&postalCode=10999&range=14
     &skills=IPA,IPA_HP&isPriorityCustomer=true&dealId=624371
     &streetNumber=1&street=Unter%20den%20Linden&city=Berlin&state=Berlin&country=Germany

   NOTE: "gcId" = Global Customer ID (confirmed).
--------------------------------------------------------------- */
const params = new URLSearchParams(window.location.search);
const customer = {
  customerId: params.get("customerId") || "",
  name: params.get("name") || "",
  orderNumber: params.get("orderNumber") || "",
  gcId: params.get("gcId") || "",
  signUpId: params.get("signUpId") || "",
  latitude: params.get("latitude") ? Number(params.get("latitude")) : null,
  longitude: params.get("longitude") ? Number(params.get("longitude")) : null,
  postalCode: params.get("postalCode") || "",
  range: params.get("range") ? Number(params.get("range")) : CONFIG.DEFAULT_RANGE,
  skills: (params.get("skills") || "").split(",").map(s => s.trim()).filter(Boolean),
  isPriorityCustomer: params.get("isPriorityCustomer") === "true",
  dealId: params.get("dealId") || "",
  // address fields — only needed for the booking call, harmless to include here too
  streetNumber: params.get("streetNumber") || "",
  street: params.get("street") || "",
  city: params.get("city") || "",
  state: params.get("state") || "",
  country: params.get("country") || ""
};
const useMock = params.get("mock") === "1";

const subtitleParts = [CONFIG.SERVICE_NAME];
if (customer.name) subtitleParts.push("für " + customer.name);
document.getElementById("cardSubtitle").textContent = subtitleParts.join(" · ");

document.getElementById("closeBtn").addEventListener("click", () => {
  window.parent.postMessage({ type: "close_booking_widget" }, "*");
});

/* ---------------------------------------------------------------
   State
--------------------------------------------------------------- */
let slotsByDate = {};   // "2026-08-27" -> [{startDate, endDate, teamId, label}, ...]
let viewMonth = new Date();
viewMonth.setDate(1);
let selectedDateKey = null;
let selectedSlot = null;

const dayKey = d => d.toISOString().slice(0,10);
const pad2 = n => String(n).padStart(2, "0");

/* ---------------------------------------------------------------
   Fetch available slots
--------------------------------------------------------------- */
async function loadSlots(){
  document.getElementById("calLoading").style.display = "block";
  try{
    let suggestions;
    if (useMock) {
      suggestions = mockSuggestions();
    } else {
      const res = await fetch(CONFIG.GET_SLOTS_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          orderNumber: customer.orderNumber,
          gcId: customer.gcId,
          signUpId: customer.signUpId,
          latitude: customer.latitude,
          longitude: customer.longitude,
          postalCode: customer.postalCode,
          range: customer.range,
          skills: customer.skills,
          isPriorityCustomer: customer.isPriorityCustomer,
          dealId: customer.dealId
        })
      });
      if (!res.ok) throw new Error("Slot request failed (" + res.status + ")");
      const raw = await res.json();
      // Expects the clean shape { appointmentSuggestions: [...] } from the
      // Webhook Response module. Falls back to unwrapping Make's raw bundle
      // shape (array of { data: { data: { appointmentSuggestions } } }) in
      // case the response module forwards the whole HTTP output as-is.
      const body = Array.isArray(raw) ? raw[0] : raw;
      suggestions = body?.appointmentSuggestions
        || body?.data?.appointmentSuggestions
        || body?.data?.data?.appointmentSuggestions
        || [];
    }
    slotsByDate = {};
    suggestions.forEach(s => {
      // startTimeWindow/endTimeWindow are what we show the customer.
      // startDate/endDate stay attached on the slot object unchanged,
      // since those are what the booking call needs to send back.
      const winStart = new Date(s.startTimeWindow);
      const winEnd = new Date(s.endTimeWindow);
      const key = dayKey(winStart);
      const mainLabel = pad2(winStart.getHours()) + ":" + pad2(winStart.getMinutes()) + " Uhr";
      const subLabel = pad2(winStart.getHours()) + ":" + pad2(winStart.getMinutes())
        + " – " + pad2(winEnd.getHours()) + ":" + pad2(winEnd.getMinutes());
      (slotsByDate[key] ||= []).push({ ...s, mainLabel, subLabel });
    });
    Object.values(slotsByDate).forEach(list => list.sort((a,b) => new Date(a.startTimeWindow) - new Date(b.startTimeWindow)));
  } catch(err){
    console.error(err);
    document.getElementById("calLoading").textContent = "Verfügbarkeit konnte nicht geladen werden. Bitte Seite neu laden.";
    return;
  }
  document.getElementById("calLoading").style.display = "none";

  const sortedKeys = Object.keys(slotsByDate).sort();
  if (sortedKeys.length > 0 && !selectedDateKey) {
    const firstKey = sortedKeys[0];
    viewMonth = new Date(firstKey + "T00:00:00");
    viewMonth.setDate(1);
    selectDate(firstKey);
  } else {
    renderCalendar();
  }
}

function mockSuggestions(){
  // local preview data, used when ?mock=1 is present
  const out = [];
  const base = new Date();
  for (let i=1;i<12;i++){
    const d = new Date(base);
    d.setDate(base.getDate()+i);
    if (d.getDay()===0 || d.getDay()===6) continue;
    [8,10,11].forEach(h=>{
      const start = new Date(d); start.setHours(h, 0, 0, 0);
      const end = new Date(start); end.setHours(end.getHours()+1);
      out.push({
        teamId: "team_mock",
        startDate: start.toISOString(),
        endDate: end.toISOString(),
        startTimeWindow: start.toISOString(),
        endTimeWindow: end.toISOString()
      });
    });
  }
  return out;
}

/* ---------------------------------------------------------------
   Render month grid
--------------------------------------------------------------- */
function renderCalendar(){
  const grid = document.getElementById("daysGrid");
  grid.innerHTML = "";
  document.getElementById("calMonth").textContent =
    viewMonth.toLocaleDateString("de-DE", { month: "long", year: "numeric" });

  const firstOfMonth = new Date(viewMonth);
  const startOffset = (firstOfMonth.getDay() + 6) % 7; // Monday = 0
  const gridStart = new Date(firstOfMonth);
  gridStart.setDate(gridStart.getDate() - startOffset);

  for (let i=0;i<42;i++){
    const d = new Date(gridStart);
    d.setDate(gridStart.getDate()+i);
    const key = dayKey(d);
    const inMonth = d.getMonth() === viewMonth.getMonth();
    const hasSlots = inMonth && !!slotsByDate[key];

    const cell = document.createElement("div");
    cell.className = "day" + (inMonth ? " in-month" : "") + (hasSlots ? " has-slots" : "") +
      (key === selectedDateKey ? " selected" : "");
    cell.textContent = d.getDate();
    if (hasSlots){
      cell.addEventListener("click", () => selectDate(key));
    }
    grid.appendChild(cell);
  }

  const now = new Date();
  document.getElementById("prevMonth").disabled =
    viewMonth.getFullYear() === now.getFullYear() && viewMonth.getMonth() === now.getMonth();
}

function selectDate(key){
  selectedDateKey = key;
  selectedSlot = null;
  renderCalendar();
  renderSlots();
  renderFooter();
}

function renderSlots(){
  const list = document.getElementById("slotsList");
  list.innerHTML = "";
  if (!selectedDateKey) return;

  const slots = slotsByDate[selectedDateKey] || [];
  if (slots.length === 0){
    const msg = document.createElement("div");
    msg.className = "no-slots-msg";
    msg.textContent = "An diesem Tag ist kein Zeitfenster verfügbar.";
    list.appendChild(msg);
    return;
  }
  slots.forEach(slot => {
    const card = document.createElement("div");
    card.className = "slot-card" + (selectedSlot === slot ? " selected" : "");
    card.innerHTML = `<div class="slot-main">${slot.mainLabel}</div><div class="slot-sub">${slot.subLabel}</div>`;
    card.addEventListener("click", () => {
      selectedSlot = slot;
      renderSlots();
      renderFooter();
    });
    list.appendChild(card);
  });
}

function renderFooter(){
  const summary = document.getElementById("footerSummary");
  const confirmBtn = document.getElementById("confirmBtn");
  if (!selectedSlot){
    summary.textContent = "Noch keine Auswahl";
    summary.classList.add("empty");
    confirmBtn.disabled = true;
    return;
  }
  const d = new Date(selectedSlot.startTimeWindow);
  const dateStr = pad2(d.getDate()) + "." + pad2(d.getMonth()+1) + "." + String(d.getFullYear()).slice(-2);
  const timeStr = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  summary.textContent = dateStr + ", " + timeStr;
  summary.classList.remove("empty");
  confirmBtn.disabled = false;
}

document.getElementById("cancelSelectionBtn").addEventListener("click", () => {
  selectedSlot = null;
  renderSlots();
  renderFooter();
});

document.getElementById("confirmBtn").addEventListener("click", () => {
  if (selectedSlot) askFinalConfirmation(selectedSlot);
});

function askFinalConfirmation(slot){
  const d = new Date(slot.startTimeWindow);
  const dateStr = pad2(d.getDate()) + "." + pad2(d.getMonth()+1) + "." + String(d.getFullYear()).slice(-2);
  showOverlay(`
    <div class="status-card">
      <h2>Termin verbindlich buchen?</h2>
      <p>${dateStr}, ${slot.subLabel}${customer.name ? " — für " + customer.name : ""}</p>
      <div class="footer-actions" style="justify-content:center;">
        <button class="btn btn-secondary" id="cancelFinalBtn">Zurück</button>
        <button class="btn btn-primary" id="confirmFinalBtn">Verbindlich buchen</button>
      </div>
    </div>
  `);
  document.getElementById("cancelFinalBtn").addEventListener("click", removeOverlay);
  document.getElementById("confirmFinalBtn").addEventListener("click", () => bookSlot(slot));
}

/* ---------------------------------------------------------------
   Book
--------------------------------------------------------------- */
async function bookSlot(slot){
  showOverlay(`
    <div class="status-card">
      <div class="spinner"></div>
      <h2>Termin wird gebucht…</h2>
    </div>
  `);
  try{
    let confirmationId = null;
    if (useMock) {
      await new Promise(r => setTimeout(r, 900));
      confirmationId = "mock-12345";
    } else {
      const res = await fetch(CONFIG.BOOK_SLOT_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...customer, teamId: slot.teamId, startDate: slot.startDate, endDate: slot.endDate })
      });
      const raw = await res.json();
      // Handles both the clean shape { success, confirmationId } from the
      // Webhook Response module, and Make's raw bundle shape (array of
      // { data: { success, data: confirmationId } }) as a fallback.
      const bundle = Array.isArray(raw) ? raw[0] : raw;
      const inner = bundle?.data && typeof bundle.data === "object" ? bundle.data : bundle;
      const success = inner?.success;
      confirmationId = inner?.confirmationId || (typeof inner?.data === "string" ? inner.data : null);
      if (!res.ok || success === false) {
        throw new Error("Booking not confirmed" + (inner?.exception ? ": " + inner.exception : ""));
      }
    }
    const d = new Date(slot.startTimeWindow);
    const dateLabel = d.toLocaleDateString("de-DE", { weekday: "long", month: "long", day: "numeric" });
    showOverlay(`
      <div class="status-card">
        <div class="icon-circle success">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>
        </div>
        <h2>Termin gebucht</h2>
        <p>${dateLabel}, ${slot.subLabel}${customer.name ? " — für " + customer.name : ""}</p>
        ${confirmationId ? `<p style="margin-top:-10px;font-size:12px;">Bestätigungsnummer: ${confirmationId}</p>` : ""}
      </div>
    `);
    window.parent.postMessage({ type: "appointment_booked", customerId: customer.customerId, slot, confirmationId }, "*");
  } catch(err){
    console.error(err);
    showOverlay(`
      <div class="status-card">
        <div class="icon-circle error">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </div>
        <h2>Termin konnte nicht gebucht werden</h2>
        <p>Das Zeitfenster wurde möglicherweise gerade vergeben. Bitte ein anderes wählen.</p>
        <div class="footer-actions" style="justify-content:center;margin-top:6px;">
          <button class="btn btn-primary" id="retryBtn">Anderes Zeitfenster wählen</button>
        </div>
      </div>
    `);
    document.getElementById("retryBtn").addEventListener("click", () => { removeOverlay(); loadSlots(); });
  }
}

function showOverlay(html){
  removeOverlay();
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.id = "activeOverlay";
  overlay.innerHTML = html;
  document.getElementById("card").appendChild(overlay);
}
function removeOverlay(){
  const el = document.getElementById("activeOverlay");
  if (el) el.remove();
}

document.getElementById("prevMonth").addEventListener("click", () => {
  viewMonth.setMonth(viewMonth.getMonth()-1);
  renderCalendar();
});
document.getElementById("nextMonth").addEventListener("click", () => {
  viewMonth.setMonth(viewMonth.getMonth()+1);
  renderCalendar();
});

loadSlots();
</script>
