<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book an appointment</title>
<style>
  :root{
    --bg:#FAFAF7;
    --panel:#FFFFFF;
    --border:#E4E1D9;
    --border-strong:#D2CEC2;
    --ink:#1D1C19;
    --ink-muted:#6B6862;
    --ink-faint:#A8A498;
    --accent:#1F4B44;
    --accent-soft:#E7EFEC;
    --accent-contrast:#FFFFFF;
    --danger:#B3261E;
    --radius:10px;
    --font-display:'Space Grotesk','Inter',sans-serif;
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:1000px;
    margin:0 auto;
    padding:24px 20px 60px;
  }
  .layout{
    display:grid;
    grid-template-columns:280px 1fr 220px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:var(--panel);
    overflow:hidden;
    min-height:520px;
  }
  @media (max-width:820px){
    .layout{grid-template-columns:1fr;}
    .info-col{border-bottom:1px solid var(--border);}
    .calendar-col{border-bottom:1px solid var(--border);}
  }

  /* left info column */
  .info-col{
    padding:28px 24px;
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
  }
  .service-label{
    font-size:12px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-bottom:6px;
  }
  .service-name{
    font-family:var(--font-display);
    font-size:22px;
    font-weight:500;
    margin:0 0 14px;
    line-height:1.25;
  }
  .duration{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    color:var(--ink-muted);
    margin-bottom:18px;
  }
  .duration svg{width:14px;height:14px;stroke:var(--ink-muted);}
  .customer-card{
    background:var(--accent-soft);
    border-radius:8px;
    padding:14px 16px;
    font-size:13px;
    color:var(--accent);
    margin-top:auto;
  }
  .customer-card .label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    opacity:0.75;
    margin-bottom:2px;
  }
  .customer-card .name{font-weight:600;font-size:14px;}

  /* calendar column */
  .calendar-col{
    padding:24px;
    border-right:1px solid var(--border);
  }
  .cal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .cal-month{
    font-family:var(--font-display);
    font-size:17px;
    font-weight:500;
  }
  .cal-nav{display:flex;gap:4px;}
  .cal-nav button{
    width:28px;height:28px;
    border:1px solid var(--border);
    background:var(--panel);
    border-radius:6px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink);
  }
  .cal-nav button:hover{border-color:var(--border-strong);}
  .cal-nav button:disabled{opacity:0.35;cursor:default;}
  .weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    text-align:center;
    font-size:11px;
    color:var(--ink-faint);
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin-bottom:8px;
  }
  .weekdays div{padding:4px 0;}
  .days{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
  }
  .day{
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    font-size:13px;
    cursor:default;
    color:var(--ink-faint);
    position:relative;
  }
  .day.in-month{color:var(--ink);}
  .day.has-slots{
    color:var(--accent);
    font-weight:600;
    cursor:pointer;
  }
  .day.has-slots:hover{background:var(--accent-soft);}
  .day.selected{
    background:var(--accent);
    color:var(--accent-contrast);
  }
  .day.today.in-month:not(.selected){text-decoration:underline;text-underline-offset:3px;}

  .cal-loading, .cal-empty{
    font-size:13px;
    color:var(--ink-muted);
    padding:16px 0;
  }

  /* slots column */
  .slots-col{
    padding:24px 18px;
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:560px;
    overflow-y:auto;
  }
  .slots-col-heading{
    font-size:13px;
    font-weight:600;
    color:var(--ink-muted);
    margin-bottom:4px;
  }
  .slot-btn{
    border:1px solid var(--border);
    background:var(--panel);
    border-radius:8px;
    padding:10px 12px;
    font-size:14px;
    font-family:var(--font-body);
    color:var(--ink);
    cursor:pointer;
    text-align:center;
    transition:border-color .12s;
  }
  .slot-btn:hover{border-color:var(--accent);color:var(--accent);}
  .slot-btn.selected{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast);}
  .no-slots-msg{font-size:13px;color:var(--ink-faint);}

  /* confirm / status states */
  .overlay{
    position:absolute;inset:0;
    background:rgba(250,250,247,0.94);
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .layout{position:relative;}
  .status-card{
    max-width:360px;
    text-align:center;
  }
  .status-card h2{
    font-family:var(--font-display);
    font-size:19px;
    font-weight:500;
    margin:14px 0 6px;
  }
  .status-card p{
    font-size:14px;
    color:var(--ink-muted);
    line-height:1.5;
    margin:0 0 18px;
  }
  .icon-circle{
    width:44px;height:44px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto;
  }
  .icon-circle.success{background:var(--accent-soft);color:var(--accent);}
  .icon-circle.error{background:#FBEAE9;color:var(--danger);}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:9px 18px;
    border-radius:8px;
    border:1px solid var(--accent);
    background:var(--accent);
    color:var(--accent-contrast);
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    font-family:var(--font-body);
  }
  .btn.secondary{
    background:transparent;
    color:var(--ink);
    border-color:var(--border-strong);
  }
  .btn-row{display:flex;gap:10px;justify-content:center;}
  .spinner{
    width:22px;height:22px;
    border:2.5px solid var(--border);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin .7s linear infinite;
    margin:0 auto;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .footer-note{
    text-align:center;
    font-size:11px;
    color:var(--ink-faint);
    margin-top:14px;
  }
</style>
</head>
<body>

<div id="app">
  <div class="layout" id="layout">

    <div class="info-col">
      <div class="service-label">Appointment</div>
      <h1 class="service-name" id="serviceName">Book a consultation</h1>
      <div class="duration">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        <span id="durationLabel">30 min</span>
      </div>
      <div class="customer-card" id="customerCard" style="display:none;">
        <div class="label">Booking for</div>
        <div class="name" id="customerName"></div>
      </div>
    </div>

    <div class="calendar-col">
      <div class="cal-header">
        <div class="cal-month" id="calMonth"></div>
        <div class="cal-nav">
          <button id="prevMonth" aria-label="Previous month">‹</button>
          <button id="nextMonth" aria-label="Next month">›</button>
        </div>
      </div>
      <div class="weekdays">
        <div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div><div>Su</div>
      </div>
      <div class="days" id="daysGrid"></div>
      <div class="cal-loading" id="calLoading">Loading availability…</div>
    </div>

    <div class="slots-col" id="slotsCol">
      <div class="slots-col-heading" id="slotsHeading">Select a date</div>
      <div id="slotsList"></div>
    </div>

  </div>
</div>

<script>
/* ---------------------------------------------------------------
   CONFIG — point these at your Make.com "immediate response" webhooks
--------------------------------------------------------------- */
const CONFIG = {
  GET_SLOTS_URL: "https://hook.eu1.make.celonis.com/s7kd580bgkyxtq7hgk3aj9hjygxjicoi",
  BOOK_SLOT_URL: "https://hook.eu1.make.celonis.com/ro24vhas3durfjywni3vgaxhv96grbk5",
  SERVICE_NAME: "Book a consultation",
  DURATION_LABEL: "30 min",
  DEFAULT_RANGE: 14   // fallback search radius (km) if not passed in the URL
};

/* ---------------------------------------------------------------
   Read customer data from the URL. Noloco should build the iframe
   src with these query params filled in from the record, matching
   the suggestions API body exactly, e.g.:

   booking-calendar.html?customerId=rec123&name=Jane%20Doe
     &orderNumber=DEHP6000849617&gcId=a72da201-516f-4580-ae6d-94ca3137c63a
     &signUpId=63d06452-b76d-4d4c-98e2-d9a828d61e0
     &latitude=52.496429&longitude=13.422596&postalCode=10999&range=14
     &skills=IPA,IPA_HP&isPriorityCustomer=true&dealId=624371
     &streetNumber=1&street=Unter%20den%20Linden&city=Berlin&state=Berlin&country=Germany

   NOTE: "gcId" = Global Customer ID (confirmed).
--------------------------------------------------------------- */
const params = new URLSearchParams(window.location.search);
const customer = {
  customerId: params.get("customerId") || "",
  name: params.get("name") || "",
  orderNumber: params.get("orderNumber") || "",
  gcId: params.get("gcId") || "",
  signUpId: params.get("signUpId") || "",
  latitude: params.get("latitude") ? Number(params.get("latitude")) : null,
  longitude: params.get("longitude") ? Number(params.get("longitude")) : null,
  postalCode: params.get("postalCode") || "",
  range: params.get("range") ? Number(params.get("range")) : CONFIG.DEFAULT_RANGE,
  skills: (params.get("skills") || "").split(",").map(s => s.trim()).filter(Boolean),
  isPriorityCustomer: params.get("isPriorityCustomer") === "true",
  dealId: params.get("dealId") || "",
  // address fields — only needed for the booking call, harmless to include here too
  streetNumber: params.get("streetNumber") || "",
  street: params.get("street") || "",
  city: params.get("city") || "",
  state: params.get("state") || "",
  country: params.get("country") || ""
};
const useMock = params.get("mock") === "1";

document.getElementById("serviceName").textContent = CONFIG.SERVICE_NAME;
document.getElementById("durationLabel").textContent = CONFIG.DURATION_LABEL;
if (customer.name) {
  document.getElementById("customerCard").style.display = "block";
  document.getElementById("customerName").textContent = customer.name;
}

/* ---------------------------------------------------------------
   State
--------------------------------------------------------------- */
let slotsByDate = {};   // "2026-08-27" -> [{startDate, endDate, teamId, label}, ...]
let viewMonth = new Date();
viewMonth.setDate(1);
let selectedDateKey = null;
let selectedSlot = null;

const dayKey = d => d.toISOString().slice(0,10);

/* ---------------------------------------------------------------
   Fetch available slots
--------------------------------------------------------------- */
async function loadSlots(){
  document.getElementById("calLoading").style.display = "block";
  try{
    let suggestions;
    if (useMock) {
      suggestions = mockSuggestions();
    } else {
      const res = await fetch(CONFIG.GET_SLOTS_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          orderNumber: customer.orderNumber,
          gcId: customer.gcId,
          signUpId: customer.signUpId,
          latitude: customer.latitude,
          longitude: customer.longitude,
          postalCode: customer.postalCode,
          range: customer.range,
          skills: customer.skills,
          isPriorityCustomer: customer.isPriorityCustomer,
          dealId: customer.dealId
        })
      });
      if (!res.ok) throw new Error("Slot request failed (" + res.status + ")");
      const raw = await res.json();
      // Expects the clean shape { appointmentSuggestions: [...] } from the
      // Webhook Response module. Falls back to unwrapping Make's raw bundle
      // shape (array of { data: { data: { appointmentSuggestions } } }) in
      // case the response module forwards the whole HTTP output as-is.
      const body = Array.isArray(raw) ? raw[0] : raw;
      suggestions = body?.appointmentSuggestions
        || body?.data?.appointmentSuggestions
        || body?.data?.data?.appointmentSuggestions
        || [];
    }
    slotsByDate = {};
    suggestions.forEach(s => {
      // startTimeWindow/endTimeWindow are what we show the customer.
      // startDate/endDate stay attached on the slot object unchanged,
      // since those are what the booking call needs to send back.
      const winStart = new Date(s.startTimeWindow);
      const winEnd = new Date(s.endTimeWindow);
      const key = dayKey(winStart);
      const label = winStart.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
        + " – " + winEnd.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      (slotsByDate[key] ||= []).push({ ...s, label });
    });
    Object.values(slotsByDate).forEach(list => list.sort((a,b) => new Date(a.startTimeWindow) - new Date(b.startTimeWindow)));
  } catch(err){
    console.error(err);
    document.getElementById("calLoading").textContent = "Couldn't load availability. Please refresh.";
    return;
  }
  document.getElementById("calLoading").style.display = "none";
  renderCalendar();
}

function mockSuggestions(){
  // local preview data, used when ?mock=1 is present
  const out = [];
  const base = new Date();
  for (let i=1;i<12;i++){
    const d = new Date(base);
    d.setDate(base.getDate()+i);
    if (d.getDay()===0 || d.getDay()===6) continue;
    [9,10.5,13,15.5].forEach(h=>{
      const start = new Date(d); start.setHours(Math.floor(h), (h%1)*60, 0, 0);
      const end = new Date(start); end.setMinutes(end.getMinutes()+30);
      out.push({
        teamId: "team_mock",
        startDate: start.toISOString(),
        endDate: end.toISOString(),
        startTimeWindow: start.toISOString(),
        endTimeWindow: end.toISOString()
      });
    });
  }
  return out;
}

/* ---------------------------------------------------------------
   Render month grid
--------------------------------------------------------------- */
function renderCalendar(){
  const grid = document.getElementById("daysGrid");
  grid.innerHTML = "";
  document.getElementById("calMonth").textContent =
    viewMonth.toLocaleDateString([], { month: "long", year: "numeric" });

  const firstOfMonth = new Date(viewMonth);
  const startOffset = (firstOfMonth.getDay() + 6) % 7; // Monday = 0
  const gridStart = new Date(firstOfMonth);
  gridStart.setDate(gridStart.getDate() - startOffset);

  const todayKey = dayKey(new Date());

  for (let i=0;i<42;i++){
    const d = new Date(gridStart);
    d.setDate(gridStart.getDate()+i);
    const key = dayKey(d);
    const inMonth = d.getMonth() === viewMonth.getMonth();
    const hasSlots = inMonth && !!slotsByDate[key];

    const cell = document.createElement("div");
    cell.className = "day" + (inMonth ? " in-month" : "") + (hasSlots ? " has-slots" : "") +
      (key === todayKey ? " today" : "") + (key === selectedDateKey ? " selected" : "");
    cell.textContent = d.getDate();
    if (hasSlots){
      cell.addEventListener("click", () => selectDate(key));
    }
    grid.appendChild(cell);
  }

  const now = new Date();
  document.getElementById("prevMonth").disabled =
    viewMonth.getFullYear() === now.getFullYear() && viewMonth.getMonth() === now.getMonth();
}

function selectDate(key){
  selectedDateKey = key;
  selectedSlot = null;
  renderCalendar();
  renderSlots();
}

function renderSlots(){
  const heading = document.getElementById("slotsHeading");
  const list = document.getElementById("slotsList");
  list.innerHTML = "";

  if (!selectedDateKey){
    heading.textContent = "Select a date";
    return;
  }
  const dateObj = new Date(selectedDateKey + "T00:00:00");
  heading.textContent = dateObj.toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" });

  const slots = slotsByDate[selectedDateKey] || [];
  if (slots.length === 0){
    const msg = document.createElement("div");
    msg.className = "no-slots-msg";
    msg.textContent = "No arrival window available this day.";
    list.appendChild(msg);
    return;
  }
  const hint = document.createElement("div");
  hint.className = "no-slots-msg";
  hint.style.marginBottom = "4px";
  hint.textContent = slots.length === 1
    ? "One arrival window available:"
    : "Choose an arrival window:";
  list.appendChild(hint);
  slots.forEach(slot => {
    const btn = document.createElement("button");
    btn.className = "slot-btn";
    btn.textContent = slot.label;
    btn.addEventListener("click", () => confirmSlot(slot));
    list.appendChild(btn);
  });
}

/* ---------------------------------------------------------------
   Confirm + book
--------------------------------------------------------------- */
function confirmSlot(slot){
  selectedSlot = slot;
  const dateLabel = new Date(slot.startTimeWindow).toLocaleDateString([], {
    weekday: "long", month: "long", day: "numeric"
  });
  showOverlay(`
    <div class="status-card">
      <h2>Confirm this appointment?</h2>
      <p>${dateLabel}, arrival window ${slot.label}${customer.name ? " — for " + customer.name : ""}</p>
      <div class="btn-row">
        <button class="btn secondary" id="cancelBtn">Back</button>
        <button class="btn" id="confirmBtn">Confirm booking</button>
      </div>
    </div>
  `);
  document.getElementById("cancelBtn").addEventListener("click", removeOverlay);
  document.getElementById("confirmBtn").addEventListener("click", () => bookSlot(slot));
}

async function bookSlot(slot){
  showOverlay(`
    <div class="status-card">
      <div class="spinner"></div>
      <h2>Booking your appointment…</h2>
    </div>
  `);
  try{
    let ok = true;
    if (useMock) {
      await new Promise(r => setTimeout(r, 900));
    } else {
      const res = await fetch(CONFIG.BOOK_SLOT_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...customer, teamId: slot.teamId, startDate: slot.startDate, endDate: slot.endDate })
      });
      ok = res.ok;
      if (!ok) throw new Error("Booking failed (" + res.status + ")");
    }
    const dateLabel = new Date(slot.startTimeWindow).toLocaleDateString([], {
      weekday: "long", month: "long", day: "numeric"
    });
    showOverlay(`
      <div class="status-card">
        <div class="icon-circle success">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>
        </div>
        <h2>Appointment booked</h2>
        <p>${dateLabel}, arrival window ${slot.label}${customer.name ? " — for " + customer.name : ""}</p>
      </div>
    `);
    window.parent.postMessage({ type: "appointment_booked", customerId: customer.customerId, slot }, "*");
  } catch(err){
    console.error(err);
    showOverlay(`
      <div class="status-card">
        <div class="icon-circle error">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </div>
        <h2>Couldn't book that slot</h2>
        <p>It may have just been taken. Please pick another time.</p>
        <div class="btn-row"><button class="btn" id="retryBtn">Choose another time</button></div>
      </div>
    `);
    document.getElementById("retryBtn").addEventListener("click", () => { removeOverlay(); loadSlots(); });
  }
}

function showOverlay(html){
  removeOverlay();
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.id = "activeOverlay";
  overlay.innerHTML = html;
  document.getElementById("layout").appendChild(overlay);
}
function removeOverlay(){
  const el = document.getElementById("activeOverlay");
  if (el) el.remove();
}

/* ---------------------------------------------------------------
   Nav
--------------------------------------------------------------- */
document.getElementById("prevMonth").addEventListener("click", () => {
  viewMonth.setMonth(viewMonth.getMonth()-1);
  renderCalendar();
});
document.getElementById("nextMonth").addEventListener("click", () => {
  viewMonth.setMonth(viewMonth.getMonth()+1);
  renderCalendar();
});

loadSlots();
</script>
</body>
</html>
